# Render Blueprint for Precedent (India): Dashboard -> New -> Blueprint -> this repository, branch precedent-india.
#
# Free plan: the web service sleeps after 15 minutes without traffic (the first request then takes about a
# minute). The database is not part of this Blueprint: Render's free Postgres expires after 30 days, so the
# "Database backup and rotation" GitHub Action creates it, keeps an encrypted nightly backup of your work and
# replaces the database before it expires (see .github/workflows/database.yml). Run that workflow once by hand
# after creating this service; it sets DATABASE_URL for you.
services:
  - type: web
    name: precedent-india
    runtime: python
    plan: free
    region: frankfurt
    branch: precedent-india
    buildCommand: pip install -e ".[openai,web]" && cd web && npm ci --no-audit --no-fund && npm run build
    startCommand: uvicorn legal_brief.web.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_VERSION
        value: "22.11.0"
      # Set by the database workflow (scripts/ops/render_db.py rotate).
      - key: DATABASE_URL
        sync: false
      # The law library file (a GitHub release asset); an empty database loads it on start.
      - key: LIBRARY_SEED_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: foundry
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: FOUNDRY_ENDPOINT
        sync: false
      - key: FOUNDRY_API_KEY
        sync: false
      - key: FOUNDRY_API_VERSION
        value: "2024-10-21"
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMS
        value: "512"
      # The source check uses a reasoning model: a stricter judge of support and relevance than the writer.
      - key: CHECKER_MODEL
        value: gpt-5-mini
      - key: INCLUDE_SUMMARIES
        value: "false"
      # Open once to create your account, then set to false.
      - key: ALLOW_SIGNUP
        value: "true"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: RUNS_PER_FIRM_PER_DAY
        value: "40"
      - key: MAX_UPLOAD_MB
        value: "15"
