# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Free plan: the web service sleeps after 15 minutes without traffic (the first request then takes
# about a minute), and the free database is deleted after 30 days. Upgrade both plans for real use.
services:
  - type: web
    name: precedent
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -e ".[openai,web]" && cd web && npm ci --no-audit --no-fund && npm run build
    startCommand: uvicorn legal_brief.web.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_VERSION
        value: "22.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: precedent-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: foundry
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: FOUNDRY_ENDPOINT
        sync: false
      - key: FOUNDRY_API_KEY
        sync: false
      - key: FOUNDRY_API_VERSION
        value: "2024-10-21"
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      # The source check uses a reasoning model: a stricter judge of support and relevance than the writer.
      - key: CHECKER_MODEL
        value: gpt-5-mini
      - key: ALLOW_SIGNUP
        value: "true"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: RUNS_PER_FIRM_PER_DAY
        value: "40"
      - key: MAX_UPLOAD_MB
        value: "15"

databases:
  - name: precedent-db
    plan: free
    region: frankfurt
    databaseName: precedent
    user: precedent
