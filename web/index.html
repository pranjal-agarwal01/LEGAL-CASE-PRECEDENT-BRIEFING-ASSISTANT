<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ecede7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a2133" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Research briefs for lawyers in England and Wales, with every citation checked against its source." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Precedent</title>
    <script>
      try {
        var t = localStorage.getItem("theme") || "system";
        var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
